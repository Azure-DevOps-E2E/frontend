server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"UP","service":"frontend","version":"${APP_VERSION}","imageTag":"${APP_IMAGE_TAG}"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
