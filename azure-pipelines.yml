trigger:
  branches:
    include:
    - '*'

pr:
  branches:
    include:
    - '*'

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: frontend
    imageName: frontend
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - template: pipelines/templates/steps/checkout.yml@configTemplates
    - template: pipelines/templates/steps/node/setup.yml@configTemplates
    - template: pipelines/templates/steps/node/install.yml@configTemplates
    - template: pipelines/templates/steps/node/vitest.yml@configTemplates
    - template: pipelines/templates/steps/node/run-scripts.yml@configTemplates
      parameters:
        scripts:
        - typecheck
        - build
    - template: pipelines/templates/steps/reports.yml@configTemplates
    - template: pipelines/templates/steps/qodana.yml@configTemplates
      parameters:
        linter: qodana-js
        requiresToken: true
