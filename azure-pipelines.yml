trigger:
  branches:
    include:
    - '*'

pr:
  branches:
    include:
    - '*'

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: frontend
    imageName: frontend
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - task: NodeTool@0
      displayName: 'Use Node.js 24'
      inputs:
        versionSpec: '24.x'

    - bash: |
        set -euo pipefail
        npm ci
        npm run typecheck
        npm run test:run
        npm run build
      displayName: 'Type-check, test, and build'
